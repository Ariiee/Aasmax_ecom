{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card card-glass">
    <div class="mb-4">
      <div class="eyebrow">Account recovery</div>
      <h1 class="display-6 fw-bold">Forgot password</h1>
      <p class="text-secondary">This demo sends a mock reset instruction.</p>
    </div>
    <form method="post" action="/api/forgot-password" class="vstack gap-3">
      <input class="form-control form-control-lg form-dark" name="email" type="email" placeholder="Email">
      <button class="btn btn-outline-light btn-lg">Send reset link</button>
    </form>
  </div>
</div>
{% endblock %}
