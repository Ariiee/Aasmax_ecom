{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card card-glass">
    <div class="mb-4">
      <div class="eyebrow">Welcome back</div>
      <h1 class="display-6 fw-bold">Login to AasmaX</h1>
      <p class="text-secondary">Access your account, cart, and orders.</p>
    </div>
    <form method="post" action="/login" class="vstack gap-3">
      <input class="form-control form-control-lg form-dark" name="email" type="email" placeholder="Email">
      <input class="form-control form-control-lg form-dark" name="password" type="password" placeholder="Password">
      <button class="btn btn-primary btn-lg">Login</button>
    </form>
    <div class="mt-3 d-flex justify-content-between flex-wrap gap-2">
      <a href="/register" class="link-light">Create account</a>
      <a href="/forgot-password" class="link-secondary">Forgot password?</a>
    </div>
  </div>
</div>
{% endblock %}
