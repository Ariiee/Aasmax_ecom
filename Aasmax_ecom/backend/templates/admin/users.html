{% extends "base.html" %}
{% block content %}
<section class="px-4 px-md-5 py-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div>
      <div class="eyebrow">Users</div>
      <h1 class="h2 fw-bold mb-0">User management</h1>
    </div>
    <a href="/admin" class="btn btn-outline-light rounded-pill">Back</a>
  </div>

  <div class="card-glass p-4 mt-3">
    {% for user in users %}
      <div class="py-3 border-bottom border-secondary d-flex justify-content-between align-items-center gap-2">
        <div>
          <div class="fw-semibold">{{ user.name }}</div>
          <div class="text-secondary small">{{ user.email }}</div>
        </div>
        <span class="badge text-bg-secondary">{{ user.role }}</span>
      </div>
    {% else %}
      <p class="text-secondary mb-0">No users found.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
